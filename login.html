<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar / Registro – NotiPoli</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light">

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-newspaper me-2"></i>NotiPoli
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-house me-1"></i>Inicio
      </a>
    </div>
  </nav>

  <!-- ===== AUTH WRAPPER ===== -->
  <div class="auth-wrapper">
    <div class="auth-card card p-4 p-md-5">

      <!-- Logo -->
      <div class="text-center mb-4">
        <i class="bi bi-newspaper display-4 text-primary"></i>
        <h2 class="fw-bold mt-2 text-primary">NotiPoli</h2>
        <p class="text-muted small">Mantente enterado de todas las noticias del Poli</p>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-pills nav-fill mb-4 bg-light rounded-pill p-1" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active rounded-pill fw-semibold" id="login-tab"
                  data-bs-toggle="pill" data-bs-target="#login-panel" type="button">
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link rounded-pill fw-semibold" id="registro-tab"
                  data-bs-toggle="pill" data-bs-target="#registro-panel" type="button">
            <i class="bi bi-person-plus me-1"></i>Registrarse
          </button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">

        <!-- ===== PANEL LOGIN ===== -->
        <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
          <div id="login-alerta" class="d-none mb-3"></div>

          <form id="form-login" novalidate>
            <div class="mb-3">
              <label for="login-email" class="form-label fw-semibold">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="login-email" class="form-control"
                       placeholder="tu@correo.com" autocomplete="email" required>
              </div>
            </div>
            <div class="mb-4">
              <label for="login-password" class="form-label fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="login-password" class="form-control"
                       placeholder="••••••••" autocomplete="current-password" required>
                <button class="btn btn-outline-secondary" type="button" id="toggle-login-pass" tabindex="-1">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg" id="btn-login">
              <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
          </form>

          <p class="text-center text-muted small mt-4 mb-0">
            ¿No tienes cuenta?
            <button class="btn btn-link p-0 text-primary small" onclick="switchToRegistro()">Regístrate aquí</button>
          </p>
        </div>

        <!-- ===== PANEL REGISTRO ===== -->
        <div class="tab-pane fade" id="registro-panel" role="tabpanel">
          <div id="registro-alerta" class="d-none mb-3"></div>
          <p class="text-muted small mb-3">
            <i class="bi bi-info-circle me-1 text-primary"></i>
            Las cuentas creadas aquí tendrán perfil <strong>Registrado</strong>.
          </p>

          <form id="form-registro" novalidate>
            <div class="mb-3">
              <label for="reg-nombre" class="form-label fw-semibold">Nombre completo *</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="reg-nombre" class="form-control"
                       placeholder="Tu nombre completo" autocomplete="name">
                <div class="invalid-feedback">Ingresa tu nombre (mín. 2 caracteres).</div>
              </div>
            </div>
            <div class="mb-3">
              <label for="reg-email" class="form-label fw-semibold">Correo electrónico *</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="reg-email" class="form-control"
                       placeholder="tu@correo.com" autocomplete="email">
                <div class="invalid-feedback">Ingresa un correo válido.</div>
              </div>
            </div>
            <div class="mb-3">
              <label for="reg-password" class="form-label fw-semibold">Contraseña *</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="reg-password" class="form-control"
                       placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                <button class="btn btn-outline-secondary" type="button" id="toggle-reg-pass" tabindex="-1">
                  <i class="bi bi-eye"></i>
                </button>
                <div class="invalid-feedback">Mínimo 6 caracteres.</div>
              </div>
            </div>
            <div class="mb-4">
              <label for="reg-confirm" class="form-label fw-semibold">Confirmar contraseña *</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="reg-confirm" class="form-control"
                       placeholder="Repite tu contraseña" autocomplete="new-password">
                <div class="invalid-feedback">Las contraseñas no coinciden.</div>
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100 btn-lg" id="btn-registro">
              <i class="bi bi-person-check-fill me-2"></i>Crear Cuenta
            </button>
          </form>

          <p class="text-center text-muted small mt-4 mb-0">
            ¿Ya tienes cuenta?
            <button class="btn btn-link p-0 text-primary small" onclick="switchToLogin()">Ingresa aquí</button>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    /* ---- Si ya hay sesión activa, mostrar aviso (no redirigir) ---- */
    (function() {
      const usuario = getUsuarioActual();
      if (!usuario) return;
      const banner = document.createElement('div');
      banner.className = 'alert alert-info d-flex align-items-center gap-3 mb-4';
      banner.innerHTML = `
        <i class="bi bi-person-check-fill fs-4"></i>
        <div class="flex-grow-1">
          Ya ingresaste como <strong>${escAuth(usuario.nombre)}</strong>
          <span class="badge bg-success ms-1">${escAuth(usuario.rol)}</span>
        </div>
        <div class="d-flex gap-2">
          <a href="index.html" class="btn btn-sm btn-primary">Ir al inicio</a>
          <button onclick="logout()" class="btn btn-sm btn-outline-secondary">Salir</button>
        </div>`;
      const card = document.querySelector('.auth-card');
      if (card) card.insertAdjacentElement('afterbegin', banner);
    })();

    /* ---- Abre tab de registro si la URL lo indica ---- */
    if (location.hash === '#registro') {
      document.addEventListener('DOMContentLoaded', () => {
        bootstrap.Tab.getOrCreateInstance(document.getElementById('registro-tab')).show();
      });
    }

    function switchToRegistro() {
      bootstrap.Tab.getOrCreateInstance(document.getElementById('registro-tab')).show();
    }
    function switchToLogin() {
      bootstrap.Tab.getOrCreateInstance(document.getElementById('login-tab')).show();
    }

    /* ---- Toggle visibilidad de contraseña ---- */
    function togglePass(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const inp = document.getElementById(inputId);
      if (!btn || !inp) return;
      btn.addEventListener('click', () => {
        const shown = inp.type === 'text';
        inp.type = shown ? 'password' : 'text';
        btn.querySelector('i').className = shown ? 'bi bi-eye' : 'bi bi-eye-slash';
      });
    }
    togglePass('toggle-login-pass', 'login-password');
    togglePass('toggle-reg-pass',   'reg-password');

    /* ---- Helpers UI ---- */
    function esEmailValido(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
    }
    function mostrarAlertaAuth(id, msg, tipo) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'alert alert-' + tipo;
      el.textContent = msg;
      el.classList.remove('d-none');
      setTimeout(() => el.classList.add('d-none'), 5000);
    }
    function setEstadoInput(inputEl, ok, msg) {
      inputEl.classList.toggle('is-valid',   ok);
      inputEl.classList.toggle('is-invalid', !ok);
      const fb = inputEl.closest('.input-group')?.querySelector('.invalid-feedback');
      if (fb) fb.textContent = ok ? '' : msg;
    }
    function setBtnLoading(btnId, loading, textoOriginal) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<span class="spinner-border spinner-border-sm me-2"></span>Procesando…'
        : textoOriginal;
    }

    /* ---- LOGIN ---- */
    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!esEmailValido(email) || !password) {
        mostrarAlertaAuth('login-alerta', 'Completa todos los campos correctamente.', 'warning');
        return;
      }

      setBtnLoading('btn-login', true);
      const usuario = await loginUsuario(email, password);
      setBtnLoading('btn-login', false, '<i class="bi bi-box-arrow-in-right me-2"></i>Ingresar');

      if (!usuario) {
        mostrarAlertaAuth('login-alerta', 'Correo o contraseña incorrectos.', 'danger');
        return;
      }

      setSession(usuario);
      mostrarAlertaAuth('login-alerta', '¡Bienvenido, ' + usuario.nombre + '! Redirigiendo…', 'success');
      /* Pasar sesión en URL para compatibilidad con file:// en Firefox */
      const sessCod = encodeSession(getUsuarioActual());
      setTimeout(() => { location.href = 'index.html?_s=' + sessCod; }, 900);
    });

    /* ---- REGISTRO ---- */
    document.getElementById('form-registro').addEventListener('submit', async function(e) {
      e.preventDefault();
      const nombre   = document.getElementById('reg-nombre').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm  = document.getElementById('reg-confirm').value;

      let valido = true;
      function chk(el, ok, msg) { setEstadoInput(el, ok, msg); if (!ok) valido = false; }

      chk(document.getElementById('reg-nombre'),   nombre.length >= 2,                      'Mín. 2 caracteres.');
      chk(document.getElementById('reg-email'),    esEmailValido(email),                    'Correo inválido.');
      chk(document.getElementById('reg-password'), password.length >= 6,                    'Mín. 6 caracteres.');
      chk(document.getElementById('reg-confirm'),  confirm === password && confirm.length > 0, 'No coinciden.');

      if (!valido) return;

      setBtnLoading('btn-registro', true);
      const ok = await registrarUsuario(nombre, email, password);
      setBtnLoading('btn-registro', false, '<i class="bi bi-person-check-fill me-2"></i>Crear Cuenta');

      if (!ok) {
        mostrarAlertaAuth('registro-alerta', 'Ya existe una cuenta con este correo.', 'warning');
        return;
      }

      /* Auto-login tras registro */
      const usuario = await loginUsuario(email, password);
      setSession(usuario);
      mostrarAlertaAuth('registro-alerta', '¡Cuenta creada! Redirigiendo…', 'success');
      const sessReg = encodeSession(getUsuarioActual());
      setTimeout(() => { location.href = 'index.html?_s=' + sessReg; }, 900);
    });
  </script>
</body>
</html>
